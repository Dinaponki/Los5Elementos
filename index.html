<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Los 5 Elementos</title>
  <meta name="theme-color" content="#07110a">
  <style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:#dfffe6;background:linear-gradient(180deg,#000 0%,#021006 30%,#03120a 100%);display:flex;flex-direction:column;min-height:100vh}
header.site-header{padding:18px 16px 6px}
.site-title{display:block;margin:0 auto;text-align:center;max-width:92vw;animation:slideDownIn .7s both,pulse 2.6s ease-in-out .9s infinite}
.site-title img{display:block;width:auto!important;height:auto!important;max-width:92vw;max-height:22vh;margin:0 auto;object-fit:contain}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 24px}
.download-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.download-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;padding:14px 34px;border-radius:12px;font-size:1.15rem;min-width:220px;background:linear-gradient(180deg,rgba(38,195,85,.98),rgba(22,150,62,.98));color:#fff;outline:6px solid #fff;box-shadow:0 10px 28px rgba(8,20,10,.6),0 0 0 2px #000;transition:.18s}
.btn-text{text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.btn-sub{font-size:.86rem;opacity:.86}
.footer-links{margin-top:20px;text-align:center}
.footer-links a{color:#8dff8d;text-decoration:none;font-size:14px}
.footer-links a:hover{text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.6);display:none}
@keyframes slideDownIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media(max-width:640px){.site-title img{max-height:18vh}.download-btn{padding:12px 20px;font-size:1rem;min-width:160px}}
  </style>
</head>
<body>
<header class="site-header">
<div class="site-title"><img src="title.png" alt="Los 5 Elementos"></div>
</header>
<main>
<div class="download-wrap">
<a id="downloadLink" class="download-btn" href="Los%205%20Elementos.apk" download="Los 5 Elementos.apk"><span class="btn-text">Descargar V1.0</span></a>
<div class="btn-sub">Archivo: <strong>Los 5 Elementos.apk</strong></div>
<div class="footer-links">
<a href="privacy.html">Política de Privacidad</a>
<div style="margin-top:10px;font-size:12px;color:rgba(223,255,230,.65)">© 2026 Los 5 Elementos</div>
</div>
</div>
</main>
<div id="toast" class="toast"></div>
<script>
(()=>{
const link=document.getElementById('downloadLink');
const toast=document.getElementById('toast');
function show(t){toast.textContent=t;toast.style.display='block';clearTimeout(toast.x);toast.x=setTimeout(()=>toast.style.display='none',2400);}
link.addEventListener('click',e=>{
if(!('download' in document.createElement('a'))){
e.preventDefault();
fetch(link.href).then(r=>r.blob()).then(b=>{
const u=URL.createObjectURL(b),a=document.createElement('a');
a.href=u;a.download=link.download;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);show('Descarga iniciada');
}).catch(()=>location.href=link.href);
}else show('La descarga debería comenzar en breve');
});
})();
</script>
</body>
</html>
